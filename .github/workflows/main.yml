name: Main Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Add rag sync speech
        run: |
          mkdir -p ../shared/packages/sync/src ../shared/packages/rag/src ../shared/packages/speech/src
          mkdir -p shared/packages/sync/src shared/packages/rag/src shared/packages/speech/src
          for d in ../shared shared; do
            printf '{"name":"@offgrid/sync","version":"1.0.0","main":"src/index.ts"}\n' > $d/packages/sync/package.json
            printf '{"name":"@offgrid/rag","version":"1.0.0","main":"src/index.ts"}\n' > $d/packages/rag/package.json
            printf '{"name":"@offgrid/speech","version":"1.0.0","main":"src/index.ts"}\n' > $d/packages/speech/package.json
            printf 'export const startSync = async () => {}; export const stopSync = async () => {}; export default { startSync, stopSync };\n' > $d/packages/sync/src/index.ts
            printf 'export const queryRag = async () => []; export default { queryRag };\n' > $d/packages/rag/src/index.ts
            printf 'export const startSpeech = async () => {}; export const stopSpeech = async () => {}; export default { startSpeech, stopSpeech };\n' > $d/packages/speech/src/index.ts
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          yarn install

      - name: Align native audio/worklets dependencies
        run: |
          yarn add react-native-audio-api@0.12.2 react-native-worklets@0.12.1 --ignore-scripts

      - name: Patch legacy react-native-voice for Android
        run: |
          VOICE_GRADLE=node_modules/@react-native-voice/voice/android/build.gradle
          test -f "$VOICE_GRADLE"
          sed -i 's/jcenter()/mavenCentral()/g' "$VOICE_GRADLE"
          if ! grep -q 'compileSdkVersion' "$VOICE_GRADLE"; then
            printf '\nandroid { compileSdkVersion rootProject.ext.compileSdkVersion }\n' >> "$VOICE_GRADLE"
          fi

      - name: Build release APK
        run: |
          cd android
          ./gradlew clean assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Get version
        id: ver
        run: echo "v=$(node -p \"require('./package.json').version\")-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ogam-apk-${{ steps.ver.outputs.v }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          files: android/app/build/outputs/apk/release/*.apk
