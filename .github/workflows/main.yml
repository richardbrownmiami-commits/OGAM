name: Main Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build release APK
        run: |
          cd android
          ./gradlew clean assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Get version
        id: ver
        run: echo "v=$(node -p \"require('./package.json').version\")-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ogam-apk-${{ steps.ver.outputs.v }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          files: android/app/build/outputs/apk/release/*.apk
