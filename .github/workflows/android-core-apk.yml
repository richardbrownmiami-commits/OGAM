name: Core Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - clean-core-android

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Core Android APK (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core Android branch
        uses: actions/checkout@v4
        with:
          ref: clean-core-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run project postinstall patches
        run: npm run postinstall --if-present

      - name: Build ARM64 release APK
        working-directory: android
        run: ./gradlew clean assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          apk=$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          test -n "$apk"
          echo "APK: $apk"

      - name: Upload Core Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OGAM-core-android-arm64-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
