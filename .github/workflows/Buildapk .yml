name: OGAM Main Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'fast=120MB | full=450MB'
        default: 'fast'
        type: choice
        options: [fast, full]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ inputs.build_type }}
          max-size: 2G

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-${{ hashFiles('**/package.json') }}

      - run: |
          mkdir -p ~/.gradle/init.d
          echo 'gradle.projectsEvaluated { System.setProperty("ANDROID_CCACHE", "/usr/bin/ccache") }' > ~/.gradle/init.d/ccache.gradle

      - run: npm ci --legacy-peer-deps

      - name: Setup Signing + Version
        run: |
          cd android
          if [ ! -f app/ogam-release.keystore ]; then
            keytool -genkey -v -keystore app/ogam-release.keystore -alias ogam -keyalg RSA -keysize 2048 -validity 10000 -storepass ogam1234 -keypass ogam1234 -dname "CN=OGAM, OU=Dev, O=OGAM, L=Pathankot, S=PB, C=IN"
          fi
          echo "OGAM_UPLOAD_STORE_FILE=ogam-release.keystore" >> gradle.properties
          echo "OGAM_UPLOAD_KEY_ALIAS=ogam" >> gradle.properties
          echo "OGAM_UPLOAD_STORE_PASSWORD=ogam1234" >> gradle.properties
          echo "OGAM_UPLOAD_KEY_PASSWORD=ogam1234" >> gradle.properties
          echo "OGAM_VERSION_CODE=${{ github.run_number }}" >> gradle.properties
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">OGAM AI<\/string>/' app/src/main/res/values/strings.xml

      - run: cd android && ./gradlew clean --no-daemon

      - name: Build FAST APK (arm64)
        if: ${{ inputs.build_type != 'full' }}
        run: cd android && ./gradlew assembleRelease -PreactNativeArchs=arm64-v8a -PversionCode=${{ github.run_number }} --build-cache --no-daemon --max-workers=1

      - name: Build FULL APK (all archs)
        if: ${{ inputs.build_type == 'full' }}
        run: cd android && ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --build-cache --no-daemon

      - run: ls -lh android/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OGAM-${{ inputs.build_type }}-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: OGAM AI Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
          body: "OGAM AI - v${{ github.run_number }} Signed APK - ${{ inputs.build_type }}"
