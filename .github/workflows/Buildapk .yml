name: Dev APK
on:
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fast Check
        run: npm install --no-audit --no-fund && npx react-native config

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build 65MB
        working-directory: android
        run:./gradlew :app:assembleDevDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-65MB
          path: android/app/build/outputs/apk/dev/debug/*.apk
