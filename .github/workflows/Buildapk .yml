name: Dev APK
on:
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install deps - FAIL FAST if error
        run: npm ci --legacy-peer-deps
      - name: Check JS for errors - fails in 30 sec
        run: npm run lint || npx react-native config

  android-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Build debug APK 65MB
        working-directory: android
        run:./gradlew :app:assembleDevDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug
          path: android/app/build/outputs/apk/dev/debug/*.apk
