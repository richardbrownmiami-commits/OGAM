name: Dev APK - Personal
on:
  push:
    branches: [dev]

jobs:
  pre-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check
        run: |
          echo "### Pre-Check" >> $GITHUB_STEP_SUMMARY
          cat package.json | python3 -m json.tool
          npm install --no-audit --no-fund
          npx react-native config
          echo "- ✅ All OK" >> $GITHUB_STEP_SUMMARY

  build:
    needs: pre-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            android/.gradle
          key: gradle-arm64-${{ hashFiles('android/gradle/wrapper/**') }}

      - name: Build APK 65MB
        run: |
          npm install --no-audit --no-fund
          cd android
         ./gradlew :app:assembleDevDebug -PreactNativeArchitectures=arm64-v8a --no-daemon 2>&1 | tee /tmp/build.log

      - name: Error Summary
        if: failure()
        run: |
          echo "### ❌ FAILED - Last 10 lines" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 10 /tmp/build.log >> $GITHUB_STEP_SUMMARY || echo "no log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-65MB
          path: android/app/build/outputs/apk/dev/debug/*.apk
