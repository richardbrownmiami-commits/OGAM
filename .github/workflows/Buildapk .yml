name: Dev APK - Personal

on:
  push:
    branches: [dev]

jobs:
  pre-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Check & Summary
        run: |
          echo "### 🔍 Pre-Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if cat package.json | python3 -m json.tool > /dev/null; then
            echo "- ✅ package.json valid" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ package.json INVALID JSON" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          if npm install --no-audit --no-fund 2>&1 | tail -n 20 > /tmp/install.log; then
            echo "- ✅ npm install ok" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ npm install FAILED" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/install.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          if npx react-native config > /dev/null 2>&1; then
            echo "- ✅ Metro config ok" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Metro config failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  build:
    needs: pre-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            android/.gradle
          key: gradle-arm64-${{ hashFiles('android/gradle/**', 'android/app/build.gradle') }}

      - name: Build APK (arm64 only = 65MB)
        run: |
          npm install --no-audit --no-fund
          cd android
         ./gradlew :app:assembleDevDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          ls -lh app/build/outputs/apk/dev/debug/

      - name: On Failure - 10 line error report
        if: failure()
        run: |
          echo "### ❌ BUILD FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Last 10 lines (share this):" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 30 /tmp/build.log | tail -n 10 >> $GITHUB_STEP_SUMMARY || echo "No log file" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 /tmp/build.log > build-log.txt || echo "build failed early" > build-log.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-65MB
          path: android/app/build/outputs/apk/dev/debug/*.apk

      - name: Upload Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: build-log.txt
