name: Android Personal APK

on:
  workflow_dispatch:
  push:
    branches:
      - clean-core-android
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build personal Android APK (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run postinstall patches
        run: npm run postinstall --if-present

      - name: Build ARM64 release APK
        working-directory: android
        run: ./gradlew clean assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Verify APK exists
        run: test -n "$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OGAM-personal-arm64-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
